name: Operator test
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  forge:
    runs-on: ubuntu-latest
    steps:
      - name: forge pr artifact
        run: |
          mkdir -p pr_data
          printf '1' > pr_data/NR
          printf '0\npr=%s\n' "$(printf '%s' '' | base64 -d)" > pr_data/CI_YAML_ONLY
          cat pr_data/CI_YAML_ONLY | cut -c1-80
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pr
          path: pr_data/
